modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/SunkenInTime/minecraft-orthogonal-map/issues"

[[mods]]
modId = "diorama"
version = "${version}"
displayName = "Diorama"
description = "A ray-traced, angled voxel map and minimap."
authors = "Dara Adedeji"
displayURL = "https://modrinth.com/mod/diorama-map"
logoFile = "assets/diorama/icon.png"
# Optional on both sides: servers with or without it let the player in, players with or without it get in.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.diorama]]
modId = "forge"
mandatory = true
versionRange = "${forge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.diorama]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
